# Monero Daemon Config for P2Pool Mining (config/monerod-p2pool.conf)
# Enables ZMQ Pub on port 18083 (required by P2Pool for instant block templates).

data-dir=/var/lib/monero
log-file=/var/log/monero/monerod.log
log-level=0

# Storage & Pruning (P2Pool works with both pruned and full nodes)
prune-blockchain=1
sync-pruned-blocks=1
db-sync-mode=safe

# P2P Consensus Network
p2p-bind-ip=0.0.0.0
p2p-bind-port=18080
out-peers=32
in-peers=64
no-igd=1
enable-dns-blocklist=1

# Local RPC & ZMQ Pub for P2Pool
rpc-bind-ip=127.0.0.1
rpc-bind-port=18081
zmq-pub=tcp://127.0.0.1:18083

# Restricted Wallet RPC
rpc-restricted-bind-ip=0.0.0.0
rpc-restricted-bind-port=18089
public-node=1
confirm-external-bind=1
rpc-access-control-origins=*
disable-rpc-ban=1
